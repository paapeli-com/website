<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · Paapeli</title>
  <style>
    :root { --primary:#FF7900; --blue:#4a90e2; --blue-d:#357abd; --ink:#1f2937; --muted:#6b7280; --border:#e5e7eb; }
    * { box-sizing:border-box; }
    body { margin:0; background:#f5f5f5; color:var(--ink);
      font-family:'Poppins',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
    header { height:64px; display:flex; align-items:center; gap:8px; padding:0 24px;
      background:#fff; border-bottom:1px solid var(--border); position:sticky; top:0; }
    header .wordmark { font-weight:700; font-size:20px; color:var(--primary); }
    header .spacer { flex:1; }
    header .lang { color:var(--muted); font-size:14px; }
    main { min-height:calc(100vh - 64px); display:flex; align-items:center; justify-content:center; padding:40px 16px; }
    .card { width:100%; max-width:420px; background:#fff; border-radius:12px; padding:32px;
      box-shadow:0 10px 30px rgba(0,0,0,.08); }
    .logo { display:flex; justify-content:center; margin-bottom:20px; }
    h1 { text-align:center; font-size:24px; font-weight:500; color:#374151; margin:0 0 24px; }
    label { display:block; font-size:14px; color:#374151; margin-bottom:6px; }
    input[type=text],input[type=password]{ width:100%; height:42px; padding:0 12px; font-size:14px;
      border:1px solid #d1d5db; border-radius:6px; outline:none; background:#fff; margin-bottom:16px; }
    input:focus{ border-color:var(--blue); }
    .row-right{ text-align:right; margin:-8px 0 16px; }
    a.link{ color:var(--blue); font-size:14px; text-decoration:none; }
    a.link:hover{ text-decoration:underline; }
    button.primary{ width:100%; height:44px; border:0; border-radius:6px; background:var(--blue); color:#fff;
      font-size:15px; font-weight:500; cursor:pointer; }
    button.primary:hover{ background:var(--blue-d); }
    .divider{ display:flex; align-items:center; gap:12px; color:#9ca3af; font-size:12px; text-transform:uppercase; margin:18px 0; }
    .divider::before,.divider::after{ content:""; height:1px; background:#e5e7eb; flex:1; }
    button.google{ width:100%; height:44px; border:1px solid #d1d5db; border-radius:6px; background:#fff; color:#374151;
      font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }
    button.google:hover{ background:#f9fafb; }
    .foot{ text-align:center; font-size:14px; color:#6b7280; margin-top:22px; }
    .error{ display:none; background:#fef2f2; border:1px solid #fecaca; color:#b91c1c; font-size:13px;
      border-radius:6px; padding:10px 12px; margin-bottom:16px; }
    .success{ display:none; background:#f0fdf4; border:1px solid #bbf7d0; color:#15803d; font-size:13px;
      border-radius:6px; padding:10px 12px; margin-bottom:16px; }
    button.primary:disabled{ opacity:.6; cursor:not-allowed; }
    .card.hidden{ display:none; }
  </style>
</head>
<body>
  <header>
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M3 7C3 4.79086 4.79086 3 7 3C9.20914 3 11 4.79086 11 7C11 9.20914 9.20914 11 7 11C4.79086 11 3 9.20914 3 7Z" fill="#FF7900"/>
      <path d="M17 3C19.2091 3 21 4.79086 21 7C21 8.94683 19.6088 10.5671 17.7666 10.9248L14.6015 11.774C13.2218 12.1441 12.1443 13.2219 11.7744 14.6016L10.9238 17.7744C10.5631 19.6128 8.94411 21 7 21C4.79086 21 3 19.2091 3 17C3 15.0613 4.37913 13.4438 6.20996 13.0771L9.39678 12.2227C10.7763 11.8528 11.854 10.7754 12.2242 9.39594L13.0742 6.22852C13.4337 4.38852 15.0548 3 17 3Z" fill="#111111"/>
    </svg>
    <span class="wordmark">Paapeli</span>
    <span class="spacer"></span>
    <span class="lang">🌐 English</span>
  </header>

  <main>
    <form class="card" id="form">
      <div class="logo">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 7C3 4.79086 4.79086 3 7 3C9.20914 3 11 4.79086 11 7C11 9.20914 9.20914 11 7 11C4.79086 11 3 9.20914 3 7Z" fill="#FF7900"/>
          <path d="M17 3C19.2091 3 21 4.79086 21 7C21 8.94683 19.6088 10.5671 17.7666 10.9248L14.6015 11.774C13.2218 12.1441 12.1443 13.2219 11.7744 14.6016L10.9238 17.7744C10.5631 19.6128 8.94411 21 7 21C4.79086 21 3 19.2091 3 17C3 15.0613 4.37913 13.4438 6.20996 13.0771L9.39678 12.2227C10.7763 11.8528 11.854 10.7754 12.2242 9.39594L13.0742 6.22852C13.4337 4.38852 15.0548 3 17 3Z" fill="#111111"/>
        </svg>
      </div>
      <h1>Sign in to your account</h1>

      <div class="error" id="error"></div>
      <div class="success" id="success"></div>

      <label for="email">Email / Username</label>
      <input id="email" type="text" placeholder="name@host.com" value="sina@paapeli.com" autocomplete="username" />

      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" />

      <div class="row-right"><a class="link" href="#">Forgot password?</a></div>

      <button class="primary" type="submit" id="submit">Sign in</button>

      <div class="divider">Or</div>

      <button class="google" type="button" id="google">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continue with Google
      </button>

      <div class="foot">Don't have an account? <a class="link" href="#" id="show-signup">Sign up</a></div>
    </form>

    <form class="card hidden" id="signup-form">
      <div class="logo">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 7C3 4.79086 4.79086 3 7 3C9.20914 3 11 4.79086 11 7C11 9.20914 9.20914 11 7 11C4.79086 11 3 9.20914 3 7Z" fill="#FF7900"/>
          <path d="M17 3C19.2091 3 21 4.79086 21 7C21 8.94683 19.6088 10.5671 17.7666 10.9248L14.6015 11.774C13.2218 12.1441 12.1443 13.2219 11.7744 14.6016L10.9238 17.7744C10.5631 19.6128 8.94411 21 7 21C4.79086 21 3 19.2091 3 17C3 15.0613 4.37913 13.4438 6.20996 13.0771L9.39678 12.2227C10.7763 11.8528 11.854 10.7754 12.2242 9.39594L13.0742 6.22852C13.4337 4.38852 15.0548 3 17 3Z" fill="#111111"/>
        </svg>
      </div>
      <h1>Create your account</h1>

      <div class="error" id="signup-error"></div>

      <label for="signup-display-name">Full name</label>
      <input id="signup-display-name" type="text" placeholder="Your name" autocomplete="name" />

      <label for="signup-email">Email</label>
      <input id="signup-email" type="text" placeholder="name@host.com" autocomplete="email" />

      <label for="signup-password">Password</label>
      <input id="signup-password" type="password" placeholder="Password" autocomplete="new-password" />

      <label for="signup-confirm-password">Confirm password</label>
      <input id="signup-confirm-password" type="password" placeholder="Confirm password" autocomplete="new-password" />

      <button class="primary" type="submit" id="signup-submit">Sign up</button>

      <div class="foot">Already have an account? <a class="link" href="#" id="show-signin">Sign in</a></div>
    </form>
  </main>

  <script>
    (function () {
      var IDLE_MS = 60 * 60 * 1000; // 1 hour idle
      var API_BASE_URL = "https://gateway.paapeli.me";
      var params = new URLSearchParams(location.search);
      var redirect = params.get("redirect") || "/AIoT/SmartFactory";
      // Never redirect back to the login page itself.
      if (redirect.indexOf("/login") === 0) redirect = "/AIoT/SmartFactory";

      var form = document.getElementById("form");
      var submitBtn = document.getElementById("submit");
      var errorEl = document.getElementById("error");
      var successEl = document.getElementById("success");

      var signupForm = document.getElementById("signup-form");
      var signupSubmitBtn = document.getElementById("signup-submit");
      var signupErrorEl = document.getElementById("signup-error");

      function showError(el, message) {
        el.textContent = message;
        el.style.display = "block";
      }
      function hideError(el) {
        el.style.display = "none";
      }
      function hideSuccess() {
        successEl.style.display = "none";
      }

      document.getElementById("show-signup").addEventListener("click", function (e) {
        e.preventDefault();
        hideError(errorEl);
        hideSuccess();
        form.classList.add("hidden");
        signupForm.classList.remove("hidden");
      });
      document.getElementById("show-signin").addEventListener("click", function (e) {
        e.preventDefault();
        hideError(signupErrorEl);
        signupForm.classList.add("hidden");
        form.classList.remove("hidden");
      });

      // Persist the shared, product-agnostic session (mirrors packages/brand/session.ts's
      // Session shape) so every product app on this origin sees the same signed-in user.
      function persistSession(email, token, displayName) {
        var name = displayName || "هلدینگ هوشمند سینا";
        var s = {
          email: email,
          name: name,
          initial: (name || email || "?").trim().charAt(0).toUpperCase(),
          expiresAt: Date.now() + IDLE_MS,
          token: token,
        };
        try { localStorage.setItem("paapeli_session", JSON.stringify(s)); } catch (e) {}
      }

      function signIn(username, password) {
        hideError(errorEl);
        submitBtn.disabled = true;
        submitBtn.textContent = "Signing in…";
        fetch(API_BASE_URL + "/api/v1/aiot/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: username, password: password }),
        })
          .then(function (res) {
            if (!res.ok) {
              throw new Error(res.status === 401 ? "Invalid email or password." : "Sign in failed. Please try again.");
            }
            return res.json();
          })
          .then(function (data) {
            persistSession(username, data.token, undefined);
            location.href = redirect;
          })
          .catch(function (err) {
            showError(errorEl, err.message || "Sign in failed. Please try again.");
          })
          .finally(function () {
            submitBtn.disabled = false;
            submitBtn.textContent = "Sign in";
          });
      }

      function signUp(displayName, email, password, confirmedPassword) {
        hideError(signupErrorEl);
        signupSubmitBtn.disabled = true;
        signupSubmitBtn.textContent = "Signing up…";
        fetch(API_BASE_URL + "/api/v1/aiot/user/signup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: email,
            displayName: displayName || undefined,
            password: password,
            confirmedPassword: confirmedPassword,
          }),
        })
          .then(function (res) {
            return res.json().then(function (body) {
              if (!res.ok) {
                throw new Error((body && body.message) || "Sign up failed. Please try again.");
              }
              return body;
            });
          })
          .then(function (body) {
            var data = body && body.data ? body.data : body;
            var auth = data && data.authentication;
            if (auth && auth.token) {
              // Account is active immediately — sign the user straight in.
              persistSession(email, auth.token, data.displayName);
              location.href = redirect;
              return;
            }
            // No token back (e.g. email verification required) — send them
            // to sign in once they're ready, with a confirmation banner.
            signupForm.classList.add("hidden");
            form.classList.remove("hidden");
            document.getElementById("email").value = email;
            successEl.textContent = "Account created. Check your email to verify it, then sign in.";
            successEl.style.display = "block";
          })
          .catch(function (err) {
            showError(signupErrorEl, err.message || "Sign up failed. Please try again.");
          })
          .finally(function () {
            signupSubmitBtn.disabled = false;
            signupSubmitBtn.textContent = "Sign up";
          });
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var email = document.getElementById("email").value.trim();
        var password = document.getElementById("password").value;
        if (!email || !password) {
          showError(errorEl, "Email and password are required.");
          return;
        }
        signIn(email, password);
      });

      signupForm.addEventListener("submit", function (e) {
        e.preventDefault();
        var displayName = document.getElementById("signup-display-name").value.trim();
        var email = document.getElementById("signup-email").value.trim();
        var password = document.getElementById("signup-password").value;
        var confirmedPassword = document.getElementById("signup-confirm-password").value;
        if (!email || !password || !confirmedPassword) {
          showError(signupErrorEl, "Email, password, and confirm password are required.");
          return;
        }
        if (password !== confirmedPassword) {
          showError(signupErrorEl, "Passwords don't match.");
          return;
        }
        signUp(displayName, email, password, confirmedPassword);
      });

      document.getElementById("google").addEventListener("click", function () {
        showError(errorEl, "Google sign-in isn't available yet.");
      });
    })();
  </script>
</body>
</html>
