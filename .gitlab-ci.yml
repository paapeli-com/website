workflow:
  rules:
    # Release tags still build/deploy.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG'
      when: always
    # Only the `dev` branch runs CI/CD (build + deploy). Any other branch
    # (eric, feature branches, …) is skipped — no pipeline, no deploy.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
      when: always
    - when: never

stages:
  - build
  - deploy
  - release

variables:
  DOCKER_HOST: unix:///var/run/docker.sock
  DOCKER_PLATFORM: linux/amd64

default:
  image: registry.paapeli.me/docker:28-cli
  tags:
    - docker
  before_script:
    - mkdir -p "$HOME/.docker"
    - |
      printf '{"auths":{"%s":{"auth":"%s"}}}' \
        "$REGISTRY_URL" \
        "$(printf '%s:%s' "$REGISTRY_USER" "$REGISTRY_PASSWORD" | base64 | tr -d '\n\r')" \
        > "$HOME/.docker/config.json"

.build-push:
  stage: build
  script:
    - |
      unset DOCKER_AUTH_CONFIG
      TAG="${CI_COMMIT_TAG:-latest}"
      IMAGE="${REGISTRY_URL}/paapeli/${APP}"
      docker build --platform "$DOCKER_PLATFORM" -f "ci/docker/${APP}/Dockerfile" -t "${IMAGE}:${TAG}" .
      docker push "${IMAGE}:${TAG}"
  after_script:
    - docker rmi "${REGISTRY_URL}/paapeli/${APP}:${CI_COMMIT_TAG:-latest}" || true
    - docker image prune -f || true

build-web:
  extends: .build-push
  variables:
    APP: web

build-docs:
  extends: .build-push
  variables:
    APP: docs

build-panel:
  extends: .build-push
  variables:
    APP: panel

.deploy:
  stage: deploy
  image: registry.paapeli.me/docker:28-cli
  tags:
    - cd
    - stage
  variables:
    GIT_STRATEGY: none
  before_script:
    - apk add --no-cache bash
    - |
      if [ -n "${DOCKER_AUTH_CONFIG:-}" ]; then
        mkdir -p "$HOME/.docker"
        printf '%s' "$DOCKER_AUTH_CONFIG" > "$HOME/.docker/config.json"
        chmod 0600 "$HOME/.docker/config.json"
      fi

deploy-web:
  extends: .deploy
  needs: [build-web]
  script:
    - /var/opt/tb-mini/scripts/tb-mini-clients-redeploy web

deploy-docs:
  extends: .deploy
  needs: [build-docs]
  script:
    - /var/opt/tb-mini/scripts/tb-mini-clients-redeploy docs

deploy-panel:
  extends: .deploy
  needs: [build-panel]
  script:
    - /var/opt/tb-mini/scripts/tb-mini-clients-redeploy panel

# ─── GitOps release ───────────────────────────────────────────────────────────
# On a TAG only. The three images are already published by the build jobs; this
# records the tag in paapeli-infra and Argo CD deploys it because git changed.
# CI never touches the cluster - a commit is the only thing that can.
#
# All three front ends move together on purpose: they are built from one commit
# of one monorepo, and releasing them independently means a panel talking to a
# web build it was never tested against.
release:k8s:
  stage: release
  needs: ["build-web", "build-docs", "build-panel"]
  tags:
    - docker
  variables:
    GIT_STRATEGY: none
    INFRA_REPO: paapeli/infra
    CHART_PATH: helm/paapeli-client/values.yaml
  rules:
    - if: '$CI_COMMIT_TAG'
  before_script:
    - apk add --no-cache git yq
  script:
    - |
      set -eu
      : "${INFRA_REPO_TOKEN:?set INFRA_REPO_TOKEN (a project access token with write_repository on paapeli-infra)}"
      git clone --depth 1 --branch main \
        "https://gitops:${INFRA_REPO_TOKEN}@${CI_SERVER_HOST}/${INFRA_REPO}.git" infra
      cd infra
      # yq, not sed: this file has three `tag:` keys and a regex that matches the
      # wrong one ships the wrong image.
      for app in web docs panel; do
        TAG="$CI_COMMIT_TAG" yq -i ".apps.${app}.tag = strenv(TAG)" "$CHART_PATH"
      done
      git config user.email "ci@paapeli.me"
      git config user.name  "paapeli-client CI"
      if git diff --quiet -- "$CHART_PATH"; then
        echo "already at $CI_COMMIT_TAG - nothing to release"; exit 0
      fi
      git add "$CHART_PATH"
      git commit -m "client: release ${CI_COMMIT_TAG}" \
                 -m "web, docs and panel at ${CI_COMMIT_TAG}, built by ${CI_PIPELINE_URL}"
      git push origin main
      echo "released ${CI_COMMIT_TAG} - Argo CD will sync paapeli-client"
