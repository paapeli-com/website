workflow:
  rules:
    # Release tags still build/deploy.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG'
      when: always
    # Only the `dev` branch runs CI/CD (build + deploy). Any other branch
    # (eric, feature branches, …) is skipped — no pipeline, no deploy.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
      when: always
    - when: never

stages:
  - build
  - deploy

variables:
  DOCKER_HOST: unix:///var/run/docker.sock
  DOCKER_PLATFORM: linux/amd64

default:
  image: registry.paapeli.me/docker:28-cli
  # git01 is the BUILD runner (ci, docker, build). Tags are matched exactly and
  # completely, so this asks only for what the job needs.
  tags:
    - ci
    - docker
  before_script:
    - mkdir -p "$HOME/.docker"
    - |
      printf '{"auths":{"%s":{"auth":"%s"}}}' \
        "$REGISTRY_URL" \
        "$(printf '%s:%s' "$REGISTRY_USER" "$REGISTRY_PASSWORD" | base64 | tr -d '\n\r')" \
        > "$HOME/.docker/config.json"

.build-push:
  stage: build
  script:
    - |
      unset DOCKER_AUTH_CONFIG
      TAG="${CI_COMMIT_TAG:-latest}"
      IMAGE="${REGISTRY_URL}/paapeli/${APP}"
      # A front end's API origin has to be a BUILD arg, not runtime container
      # env: Vite inlines it into the bundle, so by the time the image runs the
      # value is already frozen in the JS. Passed only when the job defines it,
      # so web/docs builds are untouched. Never pass it empty — an empty origin
      # makes the panel call its own domain, where the SPA fallback answers with
      # the HTML shell and every API query resolves to markup.
      BUILD_ARGS=""
      if [ -n "$PAAPELI_API_BASE_URL" ]; then
        BUILD_ARGS="--build-arg PAAPELI_API_BASE_URL=$PAAPELI_API_BASE_URL"
      fi
      docker build --platform "$DOCKER_PLATFORM" $BUILD_ARGS -f "ci/docker/${APP}/Dockerfile" -t "${IMAGE}:${TAG}" .
      docker push "${IMAGE}:${TAG}"
  after_script:
    - docker rmi "${REGISTRY_URL}/paapeli/${APP}:${CI_COMMIT_TAG:-latest}" || true
    - docker image prune -f || true

build-web:
  extends: .build-push
  variables:
    APP: web

build-docs:
  extends: .build-push
  variables:
    APP: docs

build-panel:
  extends: .build-push
  variables:
    APP: panel
    # Baked into the bundle by the build above. Set here rather than in
    # deployment/helm/values.yaml, where it would have no effect at all: the
    # panel is static files by the time the container starts. Override it with a
    # CI/CD variable of the same name to point a build at another gateway.
    PAAPELI_API_BASE_URL: https://gateway.paapeli.me

.deploy:
  stage: deploy
  image: registry.paapeli.me/docker:28-cli
  # tb-mini01 is the DEPLOY runner (cd, stage, deploy, mini).
  tags:
    - cd
    - mini
  variables:
    GIT_STRATEGY: none
  before_script:
    - apk add --no-cache bash
    - |
      if [ -n "${DOCKER_AUTH_CONFIG:-}" ]; then
        mkdir -p "$HOME/.docker"
        printf '%s' "$DOCKER_AUTH_CONFIG" > "$HOME/.docker/config.json"
        chmod 0600 "$HOME/.docker/config.json"
      fi

deploy-web:
  extends: .deploy
  needs: [build-web]
  script:
    - /var/opt/tb-mini/scripts/tb-mini-clients-redeploy web

deploy-docs:
  extends: .deploy
  needs: [build-docs]
  script:
    - /var/opt/tb-mini/scripts/tb-mini-clients-redeploy docs

deploy-panel:
  extends: .deploy
  needs: [build-panel]
  script:
    - /var/opt/tb-mini/scripts/tb-mini-clients-redeploy panel
