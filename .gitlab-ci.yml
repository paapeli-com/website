workflow:
  rules:
    # Release tags still build/deploy.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG'
      when: always
    # Only the `dev` branch runs CI/CD (build + deploy). Any other branch
    # (eric, feature branches, …) is skipped — no pipeline, no deploy.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
      when: always
    - when: never

stages:
  - build
  - deploy

variables:
  DOCKER_HOST: unix:///var/run/docker.sock
  DOCKER_PLATFORM: linux/amd64

default:
  image: registry.paapeli.me/docker:28-cli
  # git01 is the BUILD runner (ci, docker, build). Tags are matched exactly and
  # completely, so this asks only for what the job needs.
  tags:
    - ci
    - docker
  before_script:
    - mkdir -p "$HOME/.docker"
    - |
      printf '{"auths":{"%s":{"auth":"%s"}}}' \
        "$REGISTRY_URL" \
        "$(printf '%s:%s' "$REGISTRY_USER" "$REGISTRY_PASSWORD" | base64 | tr -d '\n\r')" \
        > "$HOME/.docker/config.json"

.build-push:
  stage: build
  script:
    - |
      unset DOCKER_AUTH_CONFIG
      TAG="${CI_COMMIT_TAG:-latest}"
      IMAGE="${REGISTRY_URL}/paapeli/${APP}"
      # A front end's API origin has to be a BUILD arg, not runtime container
      # env: Vite inlines it into the bundle, so by the time the image runs the
      # value is already frozen in the JS. Passed only when the job defines it,
      # so web/docs builds are untouched. Never pass it empty — an empty origin
      # makes the panel call its own domain, where the SPA fallback answers with
      # the HTML shell and every API query resolves to markup.
      BUILD_ARGS=""
      if [ -n "$PAAPELI_API_BASE_URL" ]; then
        BUILD_ARGS="--build-arg PAAPELI_API_BASE_URL=$PAAPELI_API_BASE_URL"
      fi
      # Map.ir tile key: set on the build-panel job below.
      if [ -n "$PAAPELI_MAPIR_API_KEY" ]; then
        BUILD_ARGS="$BUILD_ARGS --build-arg PAAPELI_MAPIR_API_KEY=$PAAPELI_MAPIR_API_KEY"
      fi
      # staging or production: decides which unreleased products the panel shows.
      if [ -n "$PAAPELI_STAGE" ]; then
        BUILD_ARGS="$BUILD_ARGS --build-arg PAAPELI_STAGE=$PAAPELI_STAGE"
      fi
      docker build --platform "$DOCKER_PLATFORM" $BUILD_ARGS -f "ci/docker/${APP}/Dockerfile" -t "${IMAGE}:${TAG}" .
      docker push "${IMAGE}:${TAG}"
  after_script:
    - docker rmi "${REGISTRY_URL}/paapeli/${APP}:${CI_COMMIT_TAG:-latest}" || true
    - docker image prune -f || true

build-web:
  extends: .build-push
  variables:
    APP: web

build-docs:
  extends: .build-push
  variables:
    APP: docs

build-panel:
  extends: .build-push
  variables:
    APP: panel
    # Map.ir tile key for the track maps, baked in at build time like the API
    # origin below. Same key for staging and production; keep it in step with
    # apps/panel/.env.example. Public by nature (it rides in every tile URL), so
    # it is locked to our domains in the Map.ir panel rather than kept secret.
    PAAPELI_MAPIR_API_KEY: "eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiIsImp0aSI6Ijg1NDc4MTYzZTc1NDI4NWJlZDQxMzhmZmNhNmUxNTY1NTNjOTc4NTc3MWQxZDJkZmY5YzcwNGY4NzAwNDhlMTA2ZmJjODZhZjkxMDAyNGNlIn0.eyJhdWQiOiI0NDE5MiIsImp0aSI6Ijg1NDc4MTYzZTc1NDI4NWJlZDQxMzhmZmNhNmUxNTY1NTNjOTc4NTc3MWQxZDJkZmY5YzcwNGY4NzAwNDhlMTA2ZmJjODZhZjkxMDAyNGNlIiwiaWF0IjoxNzkwMTU0NjgzLCJuYmYiOjE3OTAxNTQ2ODMsImV4cCI6MTc5MjY2MDI4Mywic3ViIjoiIiwic2NvcGVzIjpbImJhc2ljIl19.Wy_EheNPiDmFTQIdo37Gjs_mZ_R2RyDHbPHu53om0i305sNR4ullxX6eMXhq_EfCcdTPzg7tmVzEnC-ydVvVFJ6YjSHuYryxxUHFmrcv6r8ld_WC_XJBGpqPG10nGeRB2Ew4i7hpNgs2nWiqejaLP27_-mF6ETF_Dw4P5cFVdZKt_nZefwJKylumDgr0N2iawzgChF9hnoDocFhsqlTM7NZuaHMEIFaOjfQpaf8qLegMk0DeFTnNMF7C44yOQHUUuVw28-6k3psZNacZYBXZCB5I-4CPmibxnHAkNflPHu0HxU030qPqCb8klwm9VRiicaNRlj60X8duNe1kKo39LQ"
  # The API origin is baked into the bundle by the build above, so it cannot be
  # one value for both builds: the image tag decides which platform this panel
  # will ever talk to.
  #
  #   a release tag  -> :$CI_COMMIT_TAG -> production -> api.paapeli.com
  #   the dev branch -> :latest         -> staging    -> api.paapeli.me
  #
  # Set via rules:variables rather than a single variables: entry, because there
  # is no runtime override available - by the time the container starts the URL
  # is already frozen in the JS. Getting this wrong ships a production panel
  # pointed at staging, which fails silently and looks like a data problem.
  #
  # These two rules cover exactly the pipelines the workflow: block allows, so
  # one of them always matches.
  #
  # PAAPELI_STAGE rides the same split: products not launched yet (AI Inference,
  # AI Agent Maker) show on staging and stay out of the production panel.
  rules:
    - if: '$CI_COMMIT_TAG'
      variables:
        PAAPELI_API_BASE_URL: https://api.paapeli.com
        PAAPELI_STAGE: production
    - if: '$CI_COMMIT_BRANCH == "dev"'
      variables:
        PAAPELI_API_BASE_URL: https://api.paapeli.me
        PAAPELI_STAGE: staging

.deploy:
  stage: deploy
  image: registry.paapeli.me/docker:28-cli
  # tb-mini01 is the DEPLOY runner (cd, stage, deploy, mini).
  tags:
    - cd
    - mini
  variables:
    GIT_STRATEGY: none
  before_script:
    - apk add --no-cache bash
    - |
      if [ -n "${DOCKER_AUTH_CONFIG:-}" ]; then
        mkdir -p "$HOME/.docker"
        printf '%s' "$DOCKER_AUTH_CONFIG" > "$HOME/.docker/config.json"
        chmod 0600 "$HOME/.docker/config.json"
      fi

deploy-web:
  extends: .deploy
  needs: [build-web]
  script:
    - /var/opt/tb-mini/scripts/tb-mini-clients-redeploy web

deploy-docs:
  extends: .deploy
  needs: [build-docs]
  script:
    - /var/opt/tb-mini/scripts/tb-mini-clients-redeploy docs

deploy-panel:
  extends: .deploy
  needs: [build-panel]
  script:
    - /var/opt/tb-mini/scripts/tb-mini-clients-redeploy panel
