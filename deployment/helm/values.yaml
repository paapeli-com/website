# Paapeli front ends.
#
# Three apps out of one monorepo and one chart. They share a shape - a stateless
# HTTP server behind a ClusterIP - so they share a template; only the image,
# port and replica count differ. Adding a fourth app is an entry in `apps`, not
# a new chart.
#
# As with the gateway, this file IS the deployment: Argo CD reconciles the
# cluster to whatever is here.

global:
  registry: registry.paapeli.me
  pullPolicy: Always
  pullSecrets: []

defaults:
  replicaCount: 2
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}
  podDisruptionBudget: {enabled: true, maxUnavailable: 1}

apps:
  # Next.js marketing site, standalone output, listens on 3000.
  web:
    enabled: true
    repository: paapeli/web
    tag: v0.2.13
    port: 3000
    # `/` is the only path guaranteed to exist on all three; each app serves it.
    probePath: /
    # Fixed NodePorts: Caddy is outside the cluster, and its upstreams are
    # written down in group_vars - an allocated port would silently 502.
    nodePort: 30300

  # Storybook, built to static HTML and served by nginx on 80.
  #
  # DISABLED in Kubernetes, deliberately. The UI kit is a development aid for
  # the people building the front ends, not something a customer opens - so it
  # is published on staging only, at uikit-mini, where the audience already is.
  # Running it here bought a second copy to keep current and a public surface
  # nobody asked for.
  #
  # `enabled: false` renders nothing: no Deployment, no Service, no PDB, and no
  # NodePort 30880. Argo CD prunes what it previously created. Its vhost, DNS
  # record and Caddy upstream are gone from the infra repo too, so
  # docs.paapeli.me does not resolve and would not answer if it did.
  #
  # The image is still built by CI - tb-mini deploys all three front ends, and
  # this is the one that only ever runs there.
  docs:
    enabled: false
    repository: paapeli/docs
    tag: v0.2.0
    port: 80
    probePath: /
    replicaCount: 1
    nodePort: 30880

  # The panel: one Vite build served by a small node server on 8080.
  panel:
    enabled: true
    repository: paapeli/panel
    tag: v0.3.18
    port: 8080
    # The panel container exposes a real health endpoint; the others only have
    # `/`, which returns their shell whether or not the app is actually ready.
    probePath: /healthz
    nodePort: 30808


# Applied to every app unless the app overrides it. The front ends talk to the
# gateway, never to ThingsBoard directly.
#
# PAAPELI_API_BASE_URL does NOT belong here, which is why it is absent: all
# three apps are static bundles by the time a container starts, and Vite has
# already inlined the API origin into the JS at build time. A value set here
# would be visible to server.mjs and ignored by the code that matters. It is set
# on the build-panel job in .gitlab-ci.yml instead.
extraEnv:
  - name: NODE_ENV
    value: production
